name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Untrusted PR fields go through env vars, never straight into the script.
      - name: Validate branch, commits, and PR title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/git/conventions.mjs branch "$HEAD_REF"
          node scripts/git/conventions.mjs title "$PR_TITLE"
          node scripts/git/conventions.mjs commits "$BASE_SHA" HEAD

  # Production dependencies only (devDependencies never ship). Reads package-lock.json, so it needs
  # no install. A failure is never ignored: fix, or review and document the advisory.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit production dependencies
        run: "npm audit --omit=dev --audit-level=high"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fallow audit compares against the merge base.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: "npm ci"
      - name: Docs
        run: "node scripts/checks/docs-check.mjs"
      - name: Lint and format
        run: "npm run lint"
      - name: Architecture, dead code, duplication, complexity
        run: "npm run fallow"
      - name: Typecheck
        run: "npm run typecheck"
      - name: Test with coverage thresholds
        run: "npm run test:coverage"
      - name: Build
        run: "npm run build"
      # Real child processes running the compiled dist/ (never the TypeScript sources): both protocol
      # eras, stdout purity, cancellation, EOF, oversized input, exit codes. Builds first; no key.
      - name: MCP built-distribution tests
        run: "npm run test:mcp-dist"

  # The deterministic suite on Windows: Windows-only filesystem cases (device paths, symlink
  # behaviour, open-file rename rules), the loopback WebSocket tests, and the MCP server built to
  # dist/ and driven over real stdio by child processes. Coverage stays on Linux.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: "npm ci"
      - name: Test
        run: "npm test"
      - name: MCP built-distribution tests
        run: "npm run test:mcp-dist"
